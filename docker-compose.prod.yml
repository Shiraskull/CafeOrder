version: '3'

services:
  vue-project:
    container_name: vue-project_prod
    build:
      context: .
      dockerfile: prod.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_PUSHER_APP_KEY: ${VITE_PUSHER_APP_KEY}
        VITE_PUSHER_APP_CLUSTER: ${VITE_PUSHER_APP_CLUSTER}
        VITE_PUSHER_APP_HOST: ${VITE_PUSHER_APP_HOST}
        VITE_PUSHER_APP_USE_TLS: ${VITE_PUSHER_APP_USE_TLS}
        VITE_BROADCAST_AUTH_ENDPOINT: ${VITE_BROADCAST_AUTH_ENDPOINT}
    image: vue-app
    ports:
      - 8080:80
